[project]
name = "harness"
version = "0.1.0"
description = "블로그 글의 front matter와 링크를 점검하는 개인 에이전트 하네스"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
]

[project.scripts]
harness = "harness.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
